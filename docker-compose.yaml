version: '3.8'

services:
  app:
    build: .
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      NODE_ENV: "${NODE_ENV:-development}"
    depends_on:
      - postgres

  postgres:
    image: "${POSTGRES_IMAGE:-postgres:latest}"
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    env_file:
      - .env
      - .env.postgres
    volumes:
      - "${DB_DATA_PATH:-./.docker/data/db}:/data/db"
      - "${DB_INIT_SCRIPT:-./migration/create.sql}:/docker-entrypoint-initdb.d/create.sql"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"

  pgadmin:
    image: "${PGADMIN_IMAGE:-dpage/pgadmin4:latest}"
    restart: unless-stopped
    env_file:
      - .env
      - .env.pgadmin
    ports:
      - "${PGADMIN_BIND:-127.0.0.1}:${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - "${PGADMIN_DATA_PATH:-./.docker/data/admin}:/var/lib/pgadmin"
    depends_on:
      - postgres
