name: Docker

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: samuel-ricardo/tax-invoice-issuer-fc
  RESOURCE_GROUP: rg-tax-invoice-fc-learn
  CONTAINER_APP_NAME: app-tax-invoice-fc-learn
  CONTAINER_APP_ENVIRONMENT: env-tax-invoice-fc-learn
  MIGRATION_JOB_NAME: ${{ vars.AZURE_MIGRATION_JOB_NAME }}

jobs:
  build:
    outputs:
      app_digest: ${{ steps.build-and-push.outputs.digest }}
      migration_digest: ${{ steps.build-migrations.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.3.0
        with:
          cosign-release: "v2.2.2"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and Push Docker Image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the Published Docker Image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"

      - name: Publish migration image
        id: build-migrations
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: Dockerfile.migrations
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrations-${{ github.sha }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

      - name: Sign the published migration image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          MIGRATION_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrations-${{ github.sha }}
          MIGRATION_DIGEST: ${{ steps.build-migrations.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${MIGRATION_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Migration image build did not return a valid immutable digest." >&2
            exit 1
          fi
          cosign sign --yes "${MIGRATION_IMAGE}@${MIGRATION_DIGEST}"

      - name: Verify published image digests
        if: ${{ github.event_name != 'pull_request' }}
        env:
          APP_IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
          MIGRATION_IMAGE_DIGEST: ${{ steps.build-migrations.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          for digest in "${APP_IMAGE_DIGEST}" "${MIGRATION_IMAGE_DIGEST}"; do
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Build did not return a valid immutable image digest." >&2
              exit 1
            fi
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate migration job configuration
        env:
          MIGRATION_JOB_NAME: ${{ env.MIGRATION_JOB_NAME }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          APP_IMAGE_DIGEST: ${{ needs.build.outputs.app_digest }}
          MIGRATION_IMAGE_DIGEST: ${{ needs.build.outputs.migration_digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MIGRATION_JOB_NAME}" ]]; then
            echo "Repository variable AZURE_MIGRATION_JOB_NAME is required; refusing to deploy without a migration gate." >&2
            exit 1
          fi
          if [[ ! "${MIGRATION_JOB_NAME}" =~ ^[a-z][a-z0-9-]{0,30}[a-z0-9]$ ]]; then
            echo "AZURE_MIGRATION_JOB_NAME is not a valid Azure Container Apps Job name." >&2
            exit 1
          fi
          if [[ -z "${GHCR_USERNAME}" || -z "${GHCR_READ_TOKEN}" ]]; then
            echo "GHCR_USERNAME and GHCR_READ_TOKEN are required; refusing to deploy without durable image-pull credentials." >&2
            exit 1
          fi
          for digest in "${APP_IMAGE_DIGEST}" "${MIGRATION_IMAGE_DIGEST}"; do
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "A valid application and migration image digest is required; refusing to deploy by tag." >&2
              exit 1
            fi
          done

      - name: Validate existing migration job prerequisite
        env:
          MIGRATION_JOB_NAME: ${{ env.MIGRATION_JOB_NAME }}
        shell: bash
        run: |
          set -euo pipefail

          trigger_type="$(az containerapp job show \
            --name "${MIGRATION_JOB_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --only-show-errors \
            --query properties.configuration.triggerType \
            --output tsv)"
          if [[ "${trigger_type}" != "Manual" ]]; then
            echo "Migration job must be an existing Manual Container Apps Job; found '${trigger_type:-unknown}'." >&2
            exit 1
          fi

          env_names="$(az containerapp job show \
            --name "${MIGRATION_JOB_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --only-show-errors \
            --query 'properties.template.containers[].env[].name' \
            --output tsv)"
          if ! grep -Fxq 'DATABASE_URL' <<< "${env_names}"; then
            echo "Existing migration job must provide DATABASE_URL through its configured environment or secret reference." >&2
            exit 1
          fi

          registry_server="$(az containerapp job show \
            --name "${MIGRATION_JOB_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --only-show-errors \
            --query "properties.configuration.registries[?server=='${REGISTRY}'] | [0].server" \
            --output tsv)"
          registry_username="$(az containerapp job show \
            --name "${MIGRATION_JOB_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --only-show-errors \
            --query "properties.configuration.registries[?server=='${REGISTRY}'] | [0].username" \
            --output tsv)"
          registry_password_secret_ref="$(az containerapp job show \
            --name "${MIGRATION_JOB_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --only-show-errors \
            --query "properties.configuration.registries[?server=='${REGISTRY}'] | [0].passwordSecretRef" \
            --output tsv)"
          if [[ "${registry_server:-}" != "${REGISTRY}" || -z "${registry_username:-}" || -z "${registry_password_secret_ref:-}" ]]; then
            echo "Existing migration job must have a ${REGISTRY} registry entry with a username and password secret reference; refusing to overwrite its pull configuration." >&2
            exit 1
          fi

          registry_secret_names="$(az containerapp job show \
            --name "${MIGRATION_JOB_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --only-show-errors \
            --query 'properties.configuration.secrets[].name' \
            --output tsv)"
          if ! grep -Fxq "${registry_password_secret_ref}" <<< "${registry_secret_names}"; then
            echo "Existing migration job registry password reference does not resolve to a configured Job secret; refusing to deploy." >&2
            exit 1
          fi

      - name: Update and start database migration job
        env:
          MIGRATION_JOB_NAME: ${{ env.MIGRATION_JOB_NAME }}
          MIGRATION_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.migration_digest }}
        shell: bash
        run: |
          set -euo pipefail
          az containerapp job update \
            --name "${MIGRATION_JOB_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${MIGRATION_IMAGE}" \
            --only-show-errors \
            --output none

          execution_name="$(az containerapp job start \
            --name "${MIGRATION_JOB_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --only-show-errors \
            --query name \
            --output tsv)"
          if [[ -z "${execution_name}" ]]; then
            echo "Azure did not return a migration execution name." >&2
            exit 1
          fi
          echo "Started migration execution ${execution_name}."

          for attempt in {1..60}; do
            status="$(az containerapp job execution show \
              --name "${MIGRATION_JOB_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --job-execution-name "${execution_name}" \
              --only-show-errors \
              --query properties.status \
              --output tsv)"
            case "${status}" in
              Succeeded)
                echo "Database migration completed successfully."
                exit 0
                ;;
              Failed|Degraded|Stopped|Canceled)
                echo "Database migration failed with status ${status}; application deployment is blocked." >&2
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "Timed out waiting for database migration; application deployment is blocked." >&2
          exit 1

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.app_digest }}
          registryUrl: ${{ env.REGISTRY }}
          registryUsername: ${{ secrets.GHCR_USERNAME }}
          registryPassword: ${{ secrets.GHCR_READ_TOKEN }}
